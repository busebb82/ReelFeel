<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ReelFeel · Ruh haline göre film önerisi</title>
    <link rel="icon" href="img/logo.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="header">
    <a class="brand" href="/">
        <img src="img/logo.svg" alt="" width="36" height="36">
        <span>Reel<span class="accent">Feel</span></span>
    </a>
</header>

<main class="container">
    <section class="hero">
        <h1>Bugün nasıl <span class="accent">hissediyorsun?</span></h1>
        <p class="subtitle">Ruh halini birkaç kelimeyle anlat, yapay zekâ sana uygun 5 film seçsin.</p>

        <form id="mood-form" class="search-card">
            <textarea id="mood" maxlength="500" rows="3"
                      placeholder="Örn: Bugün biraz yorgunum, kafamı dağıtacak hafif bir şey istiyorum..."></textarea>

            <div class="genres" id="genres"></div>

            <div class="form-footer">
                <div class="buttons">
                    <button type="button" id="more-button" class="btn btn-secondary" hidden>Başka Öner</button>
                    <button type="submit" id="recommend-button" class="btn btn-primary">Film Öner</button>
                </div>
            </div>
        </form>

        <div class="chip-row">
            <span class="chip-label">Örnekler:</span>
            <button type="button" class="chip example">Yorgunum, kafamı dağıtmak istiyorum</button>
            <button type="button" class="chip example">Romantik bir akşam geçirmek istiyorum</button>
            <button type="button" class="chip example">Motivasyona ihtiyacım var</button>
            <button type="button" class="chip example">Biraz gerilmek istiyorum</button>
        </div>

        <div class="chip-row" id="recent" hidden>
            <span class="chip-label">Son aramaların:</span>
        </div>
    </section>

    <div id="error" class="error" hidden></div>

    <section id="results" class="results"></section>
</main>

<footer class="footer">
    Film bilgileri ve afişler <a href="https://www.themoviedb.org/" target="_blank" rel="noopener">TMDB</a>'den alınmıştır.
</footer>

<script src="js/app.js"></script>
</body>
</html>
